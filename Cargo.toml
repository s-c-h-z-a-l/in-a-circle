[workspace]
resolver = "3"
# Members are listed explicitly because cargo rejects globs that match nothing.
members = ["crates/action", "crates/doc", "crates/manifest", "bins/inacircle-text", "tools/gen-entities"]
exclude = ["spikes"]

[workspace.package]
edition = "2024"
license = "MIT"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
