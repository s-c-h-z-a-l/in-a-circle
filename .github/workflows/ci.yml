name: ci

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  sandbox-qualification:
    name: Sandbox qualification (${{ matrix.runner }})
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-26.04, ubuntu-26.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Capability probe self-tests
        run: python3 -m unittest discover -s scripts/tests -p 'test_sandbox_env.py' -v

      - name: Qualify Landlock and isolated seccomp installation
        run: python3 scripts/check-sandbox-env.py --min-landlock-abi 6 --output sandbox-qualification.json

      - name: Upload qualification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sandbox-qualification-${{ matrix.runner }}
          path: sandbox-qualification.json
          if-no-files-found: error

  # The full gate, on both native architectures, on runners the job above
  # qualified (Landlock ABI >= 6, seccomp installable). The sandbox is
  # mandatory, so every test runs: a skip of a required test fails inside
  # the test itself (INACIRCLE_REQUIRE_*), not through a log grep.
  native:
    name: Native (${{ matrix.runner }})
    needs: sandbox-qualification
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-26.04, ubuntu-26.04-arm]
    runs-on: ${{ matrix.runner }}
    # A cold debug + release build of the workspace, the musl build of the
    # hardening tests and the suite itself take ~10 minutes; 45 still
    # stops a hang well before the six-hour default.
    timeout-minutes: 45
    env:
      INACIRCLE_REQUIRE_LANDLOCK: "1"
      # Every kernel control of the seccomp matrix must be provable here
      # (unprivileged user namespaces are allowed below).
      INACIRCLE_REQUIRE_KERNEL_CONTROLS: "1"
      # Passwordless sudo: the real root/setuid/capability parents run.
      INACIRCLE_REQUIRE_PRIVILEGED_TEST: "1"
    steps:
      - uses: actions/checkout@v4

      # Version and components come from rust-toolchain.toml; the musl
      # target is for the hardening tests below.
      - name: Install toolchain
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustup target add "$(uname -m)-unknown-linux-musl"
          rustc -vV

      # The key carries the architecture and the toolchain file, so an
      # x86_64 and an arm64 build, or two toolchains, never share target/.
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            target
          key: ${{ runner.os }}-${{ runner.arch }}-native-${{ hashFiles('rust-toolchain.toml') }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: ${{ runner.os }}-${{ runner.arch }}-native-${{ hashFiles('rust-toolchain.toml') }}-

      # Ubuntu's AppArmor takes capabilities away inside unprivileged user
      # namespaces; the kernel controls for capability-checked syscalls
      # (pivot_root, fsopen, ...) need one to reach the argument checks.
      - name: Allow unprivileged user namespaces
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        if: ${{ !cancelled() }}
        run: cargo clippy --workspace --all-targets -- -D warnings

      # --no-fail-fast and `!cancelled()`: every gate runs and reports even
      # after one failed; the job still fails if any did.
      - name: Test
        if: ${{ !cancelled() }}
        run: cargo test --workspace --no-fail-fast

      # D-10: the Trash undo's tests on the runner's own filesystem. Their
      # fixtures live in the temp dir; the step names its filesystem, fails
      # unless it is ext4 (GNU stat: "ext2/ext3"), and fails unless the
      # tests ran and passed there.
      - name: Undo tests on ext4
        if: ${{ !cancelled() }}
        run: |
          dir="${TMPDIR:-/tmp}"
          fs=$(stat -f -c %T "$dir")
          echo "undo fixtures in $dir: $fs"
          test "$fs" = ext2/ext3
          cargo test -p engine --lib -- trash:: journal::tests::undo_ 2>&1 | tee undo.log
          grep -Eq "test result: ok. [1-9][0-9]* passed" undo.log

      # D-27: the RSS budget guard measures the shipped (release) binary.
      # The step fails unless exactly that test ran and passed (a filter
      # that matches nothing would otherwise pass silently), and the test
      # itself fails under INACIRCLE_RSS_GATE if it did not measure a
      # release binary.
      - name: Memory budget (release)
        if: ${{ !cancelled() }}
        env:
          INACIRCLE_RSS_GATE: "1"
        run: |
          cargo test --release -p inacircle --test cli -- --exact many_groups_many_outputs_stay_within_rss_budget 2>&1 | tee rss.log
          grep -q "test result: ok. 1 passed" rss.log

      # The hardening tests again as a static musl binary: musl's own thread
      # start and fork + exec under the filter and the full sandbox.
      - name: Hardening tests (musl)
        if: ${{ !cancelled() }}
        env:
          INACIRCLE_EXPECT_MUSL: "1"
        run: cargo test -p engine --test hardening --target "$(uname -m)-unknown-linux-musl"

      - name: Fuzz target selection
        if: ${{ !cancelled() }}
        run: bash scripts/tests/test_fuzz_target.sh

      - name: Shipped dependencies
        if: ${{ !cancelled() }}
        run: scripts/check-shipped-deps.sh

      - name: Binary sizes
        if: ${{ !cancelled() }}
        run: scripts/check-sizes.sh

  # Fuzz smoke: every target runs a short libFuzzer pass on a temporary copy
  # of its corpus (scripts/fuzz.sh never writes back to the committed one).
  # Separate from `native`: it needs a nightly, and its caches must never
  # mix with the stable job's.
  fuzz-smoke:
    name: Fuzz smoke (${{ matrix.runner }})
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-26.04, ubuntu-26.04-arm]
    runs-on: ${{ matrix.runner }}
    # Seven targets at 30 s each run one after another (~4 min), plus a cold
    # build of the fuzz crate and of cargo-fuzz (~10 min). 30 minutes leaves
    # headroom for a slow runner and still stops a hung job well before the
    # six-hour default.
    timeout-minutes: 30
    env:
      # Must match NIGHTLY and FUZZ_VERSION in scripts/fuzz.sh.
      FUZZ_NIGHTLY: nightly-2026-09-01
      FUZZ_VERSION: 0.13.2
    steps:
      - uses: actions/checkout@v4

      - name: Install nightly
        run: rustup toolchain install "$FUZZ_NIGHTLY" --profile minimal -c rust-src

      # The key carries the nightly date and fuzz/Cargo.lock, and the prefix
      # differs from the stable job's, so the two never share an entry.
      # ~/.cargo/bin/cargo-fuzz is cached so the tool is not rebuilt from
      # source on every run (a cold `cargo install` takes minutes).
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/bin/cargo-fuzz
            fuzz/target
          key: ${{ runner.os }}-${{ runner.arch }}-fuzz-${{ env.FUZZ_NIGHTLY }}-${{ env.FUZZ_VERSION }}-${{ hashFiles('fuzz/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-${{ runner.arch }}-fuzz-${{ env.FUZZ_NIGHTLY }}-${{ env.FUZZ_VERSION }}-

      - name: Install cargo-fuzz
        run: |
          if ! cargo-fuzz --version 2>/dev/null | grep -q "cargo-fuzz $FUZZ_VERSION"; then
            cargo install --locked "cargo-fuzz@$FUZZ_VERSION"
          fi

      - name: Fuzz smoke
        run: scripts/fuzz.sh smoke

      # Logs and any crash, timeout or OOM input of this run.
      - name: Upload fuzz runs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-runs-${{ matrix.runner }}
          path: fuzz/runs/**
