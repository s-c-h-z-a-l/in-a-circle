[package]
name = "inacircle"
version = "0.0.0"
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
dbus = { path = "../../crates/dbus" }
engine = { path = "../../crates/engine" }
libc = "0.2"
manifest = { path = "../../crates/manifest" }
ui = { path = "../../crates/ui" }
wire = { path = "../../crates/wire" }

[dev-dependencies]
# Only a unit test, that the drop's read limits equal the invocation's.
action = { path = "../../crates/action" }
# Builds the CBZ fixtures of the end-to-end tests. Test-only: never in a
# shipped binary (scripts/check-shipped-deps.sh checks normal dependencies).
testzip = { path = "../../tools/testzip" }
