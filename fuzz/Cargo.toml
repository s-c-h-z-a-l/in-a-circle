[package]
name = "inacircle-fuzz"
version = "0.0.0"
edition = "2024"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "=0.4.13"
manifest = { path = "../crates/manifest" }
doc = { path = "../crates/doc" }
dbus = { path = "../crates/dbus" }
engine = { path = "../crates/engine" }
wire = { path = "../crates/wire" }
flate = { path = "../crates/flate" }
zip = { path = "../crates/zip" }
probe = { path = "../crates/probe" }
xml = { path = "../crates/xml" }
subtitles = { path = "../crates/subtitles" }
epub = { path = "../crates/epub" }
# The `epub_md` target includes the text family's sources, which name these.
action = { path = "../crates/action" }
libc = "0.2"

# Not part of the root workspace (it is excluded there): the fuzz crate
# builds on a pinned nightly and must not touch the shipped dependency tree.
[workspace]

# `fuzzing` is set by cargo-fuzz; declared so the included shipped sources'
# `#[cfg(fuzzing)]` items do not warn as unexpected.
[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(fuzzing)'] }

[[bin]]
name = "manifest"
path = "fuzz_targets/manifest.rs"
test = false
doc = false
bench = false

