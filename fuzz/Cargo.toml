[package]
name = "inacircle-fuzz"
version = "0.0.0"
edition = "2024"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "=0.4.13"
manifest = { path = "../crates/manifest" }
doc = { path = "../crates/doc" }
dbus = { path = "../crates/dbus" }
engine = { path = "../crates/engine" }
wire = { path = "../crates/wire" }
flate = { path = "../crates/flate" }
zip = { path = "../crates/zip" }
probe = { path = "../crates/probe" }

# Not part of the root workspace (it is excluded there): the fuzz crate
# builds on a pinned nightly and must not touch the shipped dependency tree.
[workspace]

[[bin]]
name = "manifest"
path = "fuzz_targets/manifest.rs"
test = false
doc = false
bench = false

[[bin]]
name = "markdown"
path = "fuzz_targets/markdown.rs"
test = false
doc = false
bench = false

[[bin]]
name = "dbus_message"
path = "fuzz_targets/dbus_message.rs"
test = false
doc = false
bench = false

[[bin]]
name = "uri_list"
path = "fuzz_targets/uri_list.rs"
test = false
doc = false
bench = false

[[bin]]
name = "catalog_cache"
path = "fuzz_targets/catalog_cache.rs"
test = false
doc = false
bench = false

[[bin]]
name = "history"
path = "fuzz_targets/history.rs"
test = false
doc = false
bench = false

[[bin]]
name = "wire_events"
path = "fuzz_targets/wire_events.rs"
test = false
doc = false
bench = false

[[bin]]
name = "inflate"
path = "fuzz_targets/inflate.rs"
test = false
doc = false
bench = false

[[bin]]
name = "zip_reader"
path = "fuzz_targets/zip_reader.rs"
test = false
doc = false
bench = false

[[bin]]
name = "image_probe"
path = "fuzz_targets/image_probe.rs"
test = false
doc = false
bench = false
